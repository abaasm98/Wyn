name: Prepare WYN Flutter Project

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: archive
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No project ZIP found"
            exit 1
          fi
          echo "file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract Flutter project
        run: |
          mkdir -p /tmp/wyn-project
          unzip -q "${{ steps.archive.outputs.file }}" -d /tmp/wyn-project

          PROJECT_DIR=$(dirname "$(find /tmp/wyn-project -name pubspec.yaml -print -quit)")

          if [ ! -f "$PROJECT_DIR/pubspec.yaml" ]; then
            echo "Flutter pubspec.yaml not found"
            exit 1
          fi

          cp -a "$PROJECT_DIR"/. .

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare WYN Nav Street Flutter project" || echo "No changes"
          git push
